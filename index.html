<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <title>Spanish Flashcards</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #16213e;
            border-bottom: 1px solid #0f3460;
        }

        header h1 {
            font-size: 1.1rem;
            color: #e94560;
        }

        .progress-text {
            font-size: 0.85rem;
            color: #aaa;
        }

        .mode-tabs {
            display: flex;
            background: #16213e;
            border-bottom: 1px solid #0f3460;
        }

        .mode-tabs button {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            color: #888;
            font-size: 0.9rem;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
        }

        .mode-tabs button.active {
            color: #e94560;
            border-bottom-color: #e94560;
        }

        .controls {
            display: flex;
            gap: 8px;
            padding: 10px 16px;
            background: #16213e;
            flex-wrap: wrap;
            justify-content: center;
            border-bottom: 1px solid #0f3460;
        }

        .controls button, .controls select {
            padding: 6px 12px;
            border: 1px solid #0f3460;
            border-radius: 20px;
            background: #1a1a2e;
            color: #ddd;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .controls button:hover, .controls button.active {
            background: #e94560;
            border-color: #e94560;
            color: #fff;
        }

        .controls select {
            border-radius: 8px;
        }

        /* FLASHCARD MODE */
        .card-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            perspective: 1000px;
        }

        .card {
            width: 100%;
            max-width: 400px;
            height: 260px;
            position: relative;
            cursor: pointer;
            transform-style: preserve-3d;
            transition: transform 0.5s ease;
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        .card-front {
            background: linear-gradient(135deg, #0f3460, #16213e);
            border: 2px solid #0f3460;
        }

        .card-back {
            background: linear-gradient(135deg, #533483, #0f3460);
            border: 2px solid #533483;
            transform: rotateY(180deg);
        }

        .card-category {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #e94560;
            margin-bottom: 16px;
        }

        .card-word {
            font-size: 1.8rem;
            font-weight: 700;
            text-align: center;
            line-height: 1.3;
        }

        .tap-hint {
            font-size: 0.75rem;
            color: #666;
            margin-top: 20px;
        }

        .nav-buttons {
            display: flex;
            justify-content: center;
            gap: 16px;
            padding: 16px;
            background: #16213e;
        }

        .nav-buttons button {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid #0f3460;
            background: #1a1a2e;
            color: #ddd;
            font-size: 1.3rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-buttons button:hover {
            border-color: #e94560;
            color: #e94560;
        }

        .nav-buttons .btn-know {
            background: #1b4332;
            border-color: #2d6a4f;
        }

        .nav-buttons .btn-dont-know {
            background: #3d0000;
            border-color: #6b0000;
        }

        .progress-bar {
            height: 3px;
            background: #0f3460;
        }

        .progress-bar-fill {
            height: 100%;
            background: #e94560;
            transition: width 0.3s;
        }

        .score-display {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 6px;
            font-size: 0.8rem;
        }

        .score-know { color: #40916c; }
        .score-dont { color: #d00000; }

        /* QUIZ MODE */
        .quiz-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            gap: 20px;
        }

        .quiz-prompt {
            background: linear-gradient(135deg, #0f3460, #16213e);
            border: 2px solid #0f3460;
            border-radius: 20px;
            padding: 30px 40px;
            text-align: center;
            width: 100%;
            max-width: 400px;
        }

        .quiz-prompt .card-category {
            margin-bottom: 10px;
        }

        .quiz-prompt .card-word {
            font-size: 1.6rem;
        }

        .quiz-input-area {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .quiz-input-area input {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #0f3460;
            border-radius: 12px;
            background: #16213e;
            color: #eee;
            font-size: 1.1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .quiz-input-area input:focus {
            border-color: #e94560;
        }

        .quiz-input-area input.correct {
            border-color: #40916c;
            background: #1b4332;
        }

        .quiz-input-area input.wrong {
            border-color: #d00000;
            background: #3d0000;
        }

        .quiz-submit {
            padding: 12px;
            border: none;
            border-radius: 12px;
            background: #e94560;
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .quiz-submit:hover {
            background: #c23152;
        }

        .quiz-feedback {
            width: 100%;
            max-width: 400px;
            padding: 16px 20px;
            border-radius: 12px;
            text-align: center;
            font-size: 1rem;
            min-height: 56px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .quiz-feedback.correct {
            background: #1b4332;
            border: 1px solid #2d6a4f;
            color: #95d5b2;
        }

        .quiz-feedback.wrong {
            background: #3d0000;
            border: 1px solid #6b0000;
            color: #ffb3b3;
        }

        .quiz-feedback .correct-answer {
            font-weight: 700;
            font-size: 1.1rem;
            margin-top: 4px;
        }

        .quiz-score {
            display: flex;
            gap: 24px;
            font-size: 0.9rem;
        }

        .quiz-score .right { color: #40916c; font-weight: 600; }
        .quiz-score .wrong-score { color: #d00000; font-weight: 600; }

        .hidden { display: none !important; }

        .quiz-input-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .quiz-input-row input {
            flex: 1;
        }

        .btn-mic {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 2px solid #0f3460;
            background: #1a1a2e;
            color: #ddd;
            font-size: 1.4rem;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-mic:hover {
            border-color: #e94560;
            color: #e94560;
        }

        .btn-mic.listening {
            border-color: #d00000;
            background: #3d0000;
            color: #ff4444;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .speech-status {
            font-size: 0.75rem;
            color: #888;
            text-align: center;
            min-height: 18px;
        }

        .speech-status.listening-text {
            color: #ff4444;
        }

        @media (max-width: 400px) {
            .card { height: 220px; }
            .card-word { font-size: 1.4rem; }
            .quiz-prompt .card-word { font-size: 1.3rem; }
        }
    </style>
</head>
<body>
    <header>
        <h1>Spanish Flashcards</h1>
        <span class="progress-text" id="progressText">1 / 95</span>
    </header>

    <div class="mode-tabs">
        <button id="tabFlashcard" class="active">Flashcards</button>
        <button id="tabQuiz">Quiz Mode</button>
    </div>

    <div class="progress-bar">
        <div class="progress-bar-fill" id="progressBar"></div>
    </div>

    <div class="controls">
        <select id="categoryFilter">
            <option value="all">All Categories</option>
            <option value="Saludos">Saludos</option>
            <option value="Despedidas">Despedidas</option>
            <option value="Cómo está">Cómo está</option>
            <option value="Cortesía">Cortesía</option>
            <option value="Títulos">Títulos</option>
            <option value="Presentaciones">Presentaciones</option>
            <option value="De dónde es">De dónde es</option>
            <option value="Adicionales">Adicionales</option>
            <option value="Verbos">Verbos</option>
            <option value="Sustantivos">Sustantivos</option>
            <option value="Países">Países</option>
        </select>
        <button id="btnShuffle">Shuffle</button>
        <button id="btnDirection" data-dir="en-es">EN → ES</button>
        <button id="btnReset">Reset</button>
    </div>

    <!-- FLASHCARD MODE -->
    <div id="flashcardMode">
        <div class="score-display">
            <span class="score-know" id="scoreKnow">Know: 0</span>
            <span class="score-dont" id="scoreDont">Learning: 0</span>
        </div>

        <div class="card-container">
            <div class="card" id="card">
                <div class="card-face card-front">
                    <div class="card-category" id="frontCategory"></div>
                    <div class="card-word" id="frontWord"></div>
                    <div class="tap-hint">Tap to flip</div>
                </div>
                <div class="card-face card-back">
                    <div class="card-category" id="backCategory"></div>
                    <div class="card-word" id="backWord"></div>
                </div>
            </div>
        </div>

        <div class="nav-buttons">
            <button class="btn-dont-know" id="btnDontKnow" title="Don't know">&#10007;</button>
            <button id="btnPrev" title="Previous">&#9664;</button>
            <button id="btnFlip" title="Flip">&#8635;</button>
            <button id="btnNext" title="Next">&#9654;</button>
            <button class="btn-know" id="btnKnow" title="Know it">&#10003;</button>
        </div>
    </div>

    <!-- QUIZ MODE -->
    <div id="quizMode" class="hidden">
        <div class="quiz-score">
            <span class="right" id="quizRight">Correct: 0</span>
            <span class="wrong-score" id="quizWrong">Wrong: 0</span>
        </div>

        <div class="quiz-container">
            <div class="quiz-prompt">
                <div class="card-category" id="quizCategory"></div>
                <div class="card-word" id="quizWord"></div>
            </div>

            <div class="quiz-input-area">
                <div class="quiz-input-row">
                    <input type="text" id="quizInput" placeholder="Type or speak your answer..." autocomplete="off" autocapitalize="off" spellcheck="false">
                    <button class="btn-mic" id="btnMic" title="Speak your answer">&#127908;</button>
                </div>
                <div class="speech-status" id="speechStatus"></div>
                <button class="quiz-submit" id="quizSubmit">Check Answer</button>
            </div>

            <div class="quiz-feedback hidden" id="quizFeedback">
                <span id="quizFeedbackText"></span>
                <span class="correct-answer" id="quizCorrectAnswer"></span>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
